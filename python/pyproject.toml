[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tommos-module-sdk"
version = "0.3.0"
description = "The tools of Tommos for a module that finds records: a fetch held to the manifest's hosts, the cursor, the builders of a bid and a prospect."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["tommos_module"]

[tool.setuptools.package-data]
tommos_module = ["contracts/*.json"]
